name: CI plateforme et app

# V1c (code M6) : l'app mobile est vérifiée aussi, et à chaque changement des contrats de la plateforme.
on:
  push:
    branches: ["**"]
    paths: ["plateforme/**", "mobile/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["plateforme/**", "mobile/**", ".github/workflows/ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: plateforme

jobs:
  verifier:
    name: Lint, types, tests, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: koudmen
          POSTGRES_PASSWORD: koudmen
          POSTGRES_DB: koudmen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U koudmen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://koudmen:koudmen@localhost:5432/koudmen?schema=public
      DIRECT_URL: postgresql://koudmen:koudmen@localhost:5432/koudmen?schema=public
      # Valeurs FACTICES de CI : publiques, donc refusées en production (VERCEL_ENV=production).
      SESSION_SECRET: ci-secret-uniquement-pour-les-tests-0123456789abcdef
      CRON_SECRET: ci-cron-secret-0123456789
      TESTER_INVITE_CODES: E2E-CODE-FACTICE-CI,CODE-FACTICE-CI-2
      # Les e2e créent beaucoup de bacs à sable depuis la même adresse : limites de débit coupées (CI seulement).
      RATE_LIMIT_DISABLED: "true"
      TEST_END_DATE: "2026-12-31"
      DEMO_MODE: "true"
      DEMO_PASSWORD: demo-koudmen-ci
      SEED_OPERATOR_EMAIL: operateur@koudmen.test
      SEED_OPERATOR_PASSWORD: operateur-ci-koudmen-2026
      NEXT_PUBLIC_TEST_MODE: "true"
      APP_URL: http://localhost:3100
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: plateforme/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plateforme/pnpm-lock.yaml

      - name: Installer les dépendances
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Tests unitaires
        run: pnpm test

      - name: Migrer et seeder la base
        run: pnpm db:deploy && pnpm db:seed

      - name: Build
        run: pnpm build

      # En CI (runner GitHub), on installe Chromium. En local, il est déjà dans /opt/pw-browsers.
      - name: Installer Chromium (Playwright)
        run: pnpm exec playwright install --with-deps chromium

      - name: Tests e2e
        run: pnpm e2e

      - name: Traces Playwright (si échec)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: plateforme/test-results
          retention-days: 7

  mobile:
    name: App mobile (types, contrats, tests unitaires)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Les contrats Zod de l'app doivent être la copie exacte de plateforme/src/contracts/v1.
      - name: Contrats synchronisés
        run: node scripts/sync-contracts.mjs --check

      # Tests unitaires (modules purs, sans navigateur ni serveur).
      - name: Tests hors ligne
        run: npm run -s test:hors-ligne

      - name: Tests push
        run: npm run -s test:push

      - name: Tests natifs
        run: npm run -s test:natif
